@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

comp def "CarKeeperWebUI" as E1  <<(T,blue) part  def>> [[psysml:8ddad687-bc9c-43dd-a3b3-fdce4d1a78cc ]] {
##//successions//##
noname first dashboard then plan
noname first plan then record
noname first record then plan
noname first dashboard then expenses
noname first dashboard then admin
}
